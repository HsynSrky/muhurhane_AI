<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { fill:none; stroke:#2B2B2B; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <circle cx="200" cy="200" r="190" class="line" stroke-width="3"/>

  <!-- Bayındır tamga: circle atop a vertical stem with a crossbar (Büyük Ayı / Ursa Major projection) -->
  <circle cx="200" cy="130" r="35" class="line"/>
  <line x1="200" y1="165" x2="200" y2="320" class="line"/>
  <line x1="150" y1="230" x2="250" y2="230" class="line"/>
</svg>
