<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { fill:none; stroke:#2B2B2B; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>
  <circle cx="200" cy="200" r="190" class="line" stroke-width="3"/>

  <!-- Salur tamga: "kaz ayağı" forked/trident form, symbolizing Mars/Scorpio -->
  <line x1="200" y1="90" x2="200" y2="230" class="line"/>
  <path d="M200 230 L150 320" class="line"/>
  <path d="M200 230 L200 320" class="line"/>
  <path d="M200 230 L250 320" class="line"/>

  <!-- crossbar near top -->
  <line x1="165" y1="140" x2="235" y2="140" class="line"/>
</svg>
